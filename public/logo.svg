<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon part -->
  <g transform="translate(20, 50)">
    <!-- Left person silhouette -->
    <circle cx="30" cy="30" r="15" fill="url(#logoGradient)" opacity="0.9"/>
    <path d="M 15 60 Q 15 50 30 50 Q 45 50 45 60 L 45 80 L 15 80 Z" fill="url(#logoGradient)" opacity="0.9"/>
    
    <!-- Right person silhouette -->
    <circle cx="90" cy="30" r="15" fill="url(#logoGradient)" opacity="0.9"/>
    <path d="M 75 60 Q 75 50 90 50 Q 105 50 105 60 L 105 80 L 75 80 Z" fill="url(#logoGradient)" opacity="0.9"/>
    
    <!-- Connection lines with animation -->
    <path d="M 45 40 Q 60 30 75 40" stroke="url(#logoGradient)" stroke-width="3" fill="none" opacity="0.8" filter="url(#logoGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="60" cy="32" r="4" fill="#06B6D4">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Text -->
  <text x="160" y="85" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="url(#logoGradient)" filter="url(#logoGlow)">
    StrangerConnect
  </text>
  <text x="162" y="115" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" letter-spacing="2">
    CONNECT ANONYMOUSLY
  </text>
</svg>
