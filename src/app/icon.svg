<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="60" fill="url(#bgGrad)"/>
  
  <!-- Main "S" shape made from two arrows forming connection -->
  <g filter="url(#shadow)">
    <!-- Left arrow (cyan to blue) -->
    <path d="M 70 80 L 90 80 L 90 100 L 110 85 L 90 70 L 90 90 L 70 90 Z" 
          fill="white" opacity="0.95"/>
    
    <!-- Center connection circle -->
    <circle cx="128" cy="128" r="20" fill="white" opacity="0.9">
      <animate attributeName="r" values="18;22;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Right arrow (blue to purple) -->
    <path d="M 186 176 L 166 176 L 166 156 L 146 171 L 166 186 L 166 166 L 186 166 Z" 
          fill="white" opacity="0.95"/>
  </g>
  
  <!-- Connecting wave -->
  <path d="M 90 85 Q 128 100 166 171" 
        stroke="white" 
        stroke-width="4" 
        fill="none" 
        opacity="0.6"
        stroke-linecap="round">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
