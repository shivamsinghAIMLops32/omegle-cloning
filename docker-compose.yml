services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: strangerconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: omegle_clone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - strangerconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: strangerconnect-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - strangerconnect-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Next.js Application (Development Mode)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: strangerconnect-app
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/omegle_clone?schema=public
      - REDIS_URL=redis://redis:6379
      - ADMIN_PASSWORD=your_secure_password_here
      - NEXT_PUBLIC_SITE_URL=http://localhost
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - strangerconnect-network

  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: strangerconnect-caddy
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP
      - "8080:8080"  # Alternative port
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - strangerconnect-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  strangerconnect-network:
    driver: bridge
